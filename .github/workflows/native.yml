name: Native macOS

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test persistence, providers, and queue
        run: swift test
      - name: Build local app bundle
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Brainstorm-macOS
          path: dist/Brainstorm-macOS.zip
