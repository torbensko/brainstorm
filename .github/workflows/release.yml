name: Release native macOS app

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and architecture
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
          test "$(uname -m)" = arm64
          test -f "releases/$version.md"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Import distribution certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain_path="$RUNNER_TEMP/brainstorm-release.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          printf '::add-mask::%s\n' "$keychain_password"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -d user -s "$keychain_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/ {print $2; exit}')
          test -n "$identity"
          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials BrainstormRelease --keychain "$keychain_path" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID"
      - name: Build, sign, and notarise app
        env:
          NOTARY_PROFILE: BrainstormRelease
        run: |
          ./scripts/build-app.sh
          xcrun stapler validate dist/Brainstorm.app
          spctl --assess --type execute --verbose dist/Brainstorm.app
      - name: Package and notarise downloads
        run: |
          artifact="Brainstorm-$RELEASE_VERSION-macOS-arm64"
          cp dist/Brainstorm-macOS.zip "dist/$artifact.zip"
          mkdir -p "$RUNNER_TEMP/dmg"
          ditto dist/Brainstorm.app "$RUNNER_TEMP/dmg/Brainstorm.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Brainstorm $RELEASE_VERSION" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "dist/$artifact.dmg"
          codesign --force --timestamp --sign "$CODE_SIGN_IDENTITY" "dist/$artifact.dmg"
          xcrun notarytool submit "dist/$artifact.dmg" --keychain-profile BrainstormRelease --wait
          xcrun stapler staple "dist/$artifact.dmg"
          xcrun stapler validate "dist/$artifact.dmg"
          spctl --assess --type open --context context:primary-signature --verbose "dist/$artifact.dmg"
          cp "dist/$artifact.dmg" dist/Brainstorm-macOS-arm64.dmg
          cd dist
          shasum -a 256 "$artifact.zip" "$artifact.dmg" > SHA256SUMS.txt
      - name: Sign Sparkle update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          ./scripts/generate-appcast.sh
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - --verify dist/appcast.xml
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "Brainstorm $RELEASE_VERSION" \
            --notes-file "releases/$RELEASE_VERSION.md" \
            "dist/Brainstorm-$RELEASE_VERSION-macOS-arm64.zip" \
            "dist/Brainstorm-$RELEASE_VERSION-macOS-arm64.dmg" dist/Brainstorm-macOS-arm64.dmg \
            dist/SHA256SUMS.txt dist/appcast.xml
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/brainstorm-release.keychain-db" ]; then
            security default-keychain -d user -s login.keychain-db
            security delete-keychain "$RUNNER_TEMP/brainstorm-release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
